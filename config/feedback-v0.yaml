version: feedback-v0.2
feedback:
  C1_L4: "ลำดับที่คุณเริ่มอธิบายแต่ละหัวข้อตรงกับแผนที่วางไว้ ผู้ฟังจึงตามโครงเรื่องได้ง่าย รอบหน้าคงลำดับนี้ไว้ และใช้ประโยคเปิดหัวข้อสั้น ๆ บอกว่ากำลังขึ้นเรื่องใหม่"
  C1_L3: "ลำดับส่วนใหญ่ตรงกับแผน มีบางคู่หัวข้อที่สลับกัน ดูจุดเวลาที่ระบบชี้เพื่อหาหัวข้อที่มาก่อนกำหนด แล้วซ้อมช่วงรอยต่อนั้นให้ตามแผน"
  C1_L2: "หลายหัวข้อถูกพูดสลับจากแผน ผู้ฟังอาจตามโครงเรื่องได้ยาก รอบหน้าลองเรียงหัวข้อไว้บนสไลด์สารบัญหรือโน้ต และพูดประโยคเชื่อมก่อนเปลี่ยนหัวข้อทุกครั้ง"
  C1_L1: "ลำดับที่พูดจริงต่างจากแผนมาก ลองตรวจก่อนว่ารายการหัวข้อที่ยืนยันไว้เรียงตรงกับสไลด์หรือไม่ ถ้าตรงแล้ว ให้ซ้อมพูดตามโครงทีละหัวข้อโดยดูรายการหัวข้อไปด้วย"
  C2_L4: "คุณอธิบายสาระของหัวข้อตามแผนได้ครบเกือบทุกหัวข้อ รอบหน้ารักษาความครบนี้ไว้ และตรวจว่าแต่ละหัวข้อมีตัวอย่างหรือตัวเลขรองรับอย่างน้อย 1 อย่าง"
  C2_L3: "หัวข้อส่วนใหญ่ถูกอธิบายชัดเจน แต่ยังมีบางหัวข้อที่กล่าวถึงเพียงสั้น ๆ หรือไม่ได้พูดถึง ดูตารางหัวข้อบนการ์ดนี้ แล้วเพิ่มประโยคอธิบายสาระของหัวข้อนั้นอีก 1–2 ประโยค"
  C2_L2: "ราวครึ่งหนึ่งของหัวข้อยังไม่ได้อธิบายสาระให้ชัดเจน รอบหน้าลองเขียนประเด็นหลักของแต่ละหัวข้อเป็นประโยคเดียว แล้วซ้อมพูดให้ครบทุกประโยคก่อนขึ้นหัวข้อถัดไป"
  C2_L1: "หัวข้อส่วนใหญ่ในแผนยังไม่ได้ถูกอธิบาย ตรวจว่ารายการหัวข้อที่ยืนยันตรงกับสิ่งที่ตั้งใจพูดหรือไม่ แล้วซ้อมโดยใช้รายการหัวข้อเป็นเช็กลิสต์ ติ๊กทีละหัวข้อเมื่อพูดจบ"
  S1_L4: "ความเร็วการพูดอยู่ในช่วงที่ผู้ฟังตามทัน รอบหน้ารักษาจังหวะนี้ไว้ และเว้นจังหวะสั้น ๆ หลังประโยคสำคัญเพื่อให้ผู้ฟังมีเวลาคิดตาม"
  S1_L3: "ความเร็วการพูดใกล้ช่วงที่เหมาะ แต่เร็วหรือช้ากว่าเล็กน้อย ดูคำอธิบายบนการ์ดว่าเร็วหรือช้า แล้วฟังช่วงเวลาที่ระบบชี้เพื่อปรับจังหวะในส่วนนั้น"
  S1_L2: "ความเร็วการพูดออกนอกช่วงที่เหมาะพอสมควร ถ้าเร็วไป ให้เว้นวรรคระหว่างประโยคและเน้นคำสำคัญ ถ้าช้าไป ให้ซ้อมพูดประเด็นหลักให้ต่อเนื่องโดยจับเวลาครั้งละ 1 นาที"
  S1_L1: "ความเร็วการพูดต่างจากช่วงที่เหมาะมาก ผู้ฟังอาจตามไม่ทันหรือรู้สึกว่าเนื้อหาเดินช้า ลองอัดเสียงซ้อมสั้น ๆ 1 นาที ฟังย้อน แล้วปรับให้ใกล้ความเร็วการพูดคุยปกติ"
  S2_L4: "แทบไม่มีช่วงหยุดเงียบยาว การพูดต่อเนื่องดี รอบหน้ายังใช้การหยุดสั้น ๆ อย่างตั้งใจหลังประเด็นสำคัญได้ตามเดิม"
  S2_L3: "มีช่วงหยุดเงียบยาวอยู่บ้าง ดูเวลาที่ระบบชี้ว่าส่วนใหญ่เกิดตอนเปลี่ยนหัวข้อหรือไม่ ถ้าใช่ ให้เตรียมประโยคเชื่อมระหว่างหัวข้อไว้ล่วงหน้า"
  S2_L2: "ช่วงหยุดเงียบยาวเกิดค่อนข้างบ่อยหรือนานหลายวินาที ลองฟังช่วงเวลาที่ระบบชี้ แล้วซ้อมส่วนนั้นซ้ำจนพูดต่อได้โดยไม่ต้องหยุดนึก"
  S2_L1: "มีช่วงหยุดเงียบยาวบ่อยมากหรือนานมาก ผู้ฟังอาจหลุดจากเนื้อหา รอบหน้าลองเขียนคำสำคัญของแต่ละสไลด์ไว้ในโน้ตผู้พูด และซ้อมทั้งเรื่องอย่างน้อย 2 รอบก่อนอัด"
  S3_L4: "มีเสียงเติมและคำติดปากอย่าง เอ่อ อ่า แบบว่า น้อยมาก การพูดฟังลื่นไหล รอบหน้ารักษาไว้แบบนี้ได้เลย"
  S3_L3: "มีเสียงเติมและคำติดปากอยู่บ้าง ดูเวลาที่ระบบชี้ว่ามักเกิดตอนไหน แล้วลองใช้การหยุดเงียบสั้น ๆ แทนเสียงเอ่อในจุดนั้น"
  S3_L2: "เสียงเติมและคำติดปากเกิดค่อนข้างบ่อยจนอาจดึงความสนใจจากเนื้อหา ลองซ้อมช่วงที่ระบบชี้โดยตั้งใจหยุดเงียบครึ่งวินาทีแทนการเปล่งเสียงเติมและคำติดปาก"
  S3_L1: "เสียงเติมและคำติดปากเกิดบ่อยมาก มักเกิดเมื่อยังนึกคำพูดถัดไปไม่ทัน ลองเตรียมประโยคแรกของแต่ละสไลด์ไว้ล่วงหน้า แล้วซ้อมโดยอัดเสียงและนับเสียงเติมและคำติดปากของตัวเอง"
  N1_L4: "แทบไม่มีช่วงที่มือนิ่งค้างนาน คุณใช้มือประกอบการพูดอย่างต่อเนื่อง รอบหน้ารักษาไว้แบบนี้ได้"
  N1_L3: "มีช่วงที่มือนิ่งค้างนานอยู่บ้าง ดูเวลาที่ระบบชี้ แล้วลองใช้มือชี้สไลด์หรือนับประเด็นเมื่อเปลี่ยนเรื่อง"
  N1_L2: "มือนิ่งค้างนานหลายช่วง ลองวางมือไว้ระดับเอวในท่าที่พร้อมขยับ แทนการกุมมือหรือแนบลำตัว และขยับมือเมื่อพูดถึงตัวเลขหรือการเปรียบเทียบ"
  N1_L1: "มือนิ่งค้างนานมากหรือบ่อยมาก ลองซ้อมหน้ากระจกโดยกำหนดจุดที่จะใช้มือไว้ก่อน เช่น ตอนบอกจำนวนข้อ ตอนชี้สไลด์ และตอนสรุป"
  N2_L4: "คุณหันหน้าเข้าหากล้องเกือบตลอดเวลา ผู้ชมจึงเห็นใบหน้าชัดเจน รอบหน้ารักษาไว้ และหันไปดูสไลด์เพียงสั้น ๆ เมื่อจำเป็น"
  N2_L3: "หันหน้าเข้าหากล้องเป็นส่วนใหญ่ แต่มีบางช่วงที่หันข้างหรือก้มนาน ดูเวลาที่ระบบชี้ แล้วลองดูโน้ตเป็นจังหวะสั้น ๆ ก่อนหันกลับมาทางกล้อง"
  N2_L2: "มีช่วงที่หันข้างหรือก้มค่อนข้างมาก ลองวางโน้ตหรือจอให้อยู่ใกล้แนวกล้อง และซ้อมพูดประโยคสำคัญโดยหันหน้าเข้าหากล้อง"
  N2_L1: "เวลาส่วนใหญ่ไม่ได้หันหน้าเข้าหากล้อง ผู้ชมจึงเห็นใบหน้าน้อย ลองตั้งกล้องให้อยู่ทิศเดียวกับผู้ฟังหรือจอสไลด์ และลดการอ่านโน้ตโดยจำคำสำคัญแทน"
  T1_L4: "เวลานำเสนอใกล้เวลาเป้าหมายมาก รอบหน้ารักษาการแบ่งเวลาแบบนี้ไว้ได้"
  T1_L3: "เวลานำเสนอต่างจากเป้าหมายเล็กน้อย ดูบนการ์ดว่าเกินหรือขาด แล้วปรับหัวข้อที่ใช้เวลามากหรือน้อยกว่าที่ตั้งใจ 1 หัวข้อ"
  T1_L2: "เวลานำเสนอต่างจากเป้าหมายพอสมควร ลองกำหนดเวลาให้แต่ละหัวข้อ แล้วจับเวลาขณะซ้อมทีละหัวข้อ"
  T1_L1: "เวลานำเสนอต่างจากเป้าหมายมาก ถ้าเกินให้ตัดรายละเอียดที่ไม่จำเป็นออก ถ้าขาดให้เพิ่มตัวอย่างหรือผลลัพธ์ แล้วซ้อมเต็มเรื่องพร้อมจับเวลา"

# Plain-language reading of each card (D-046 layer 2), shown next to the measured values and the 4-level band.
# explain = what the number means; levels = short reading of the level the thresholds gave (never a new level);
# range (S1) = where the value sits against the level-4 band; sign (T1) = longer or shorter than the target.
interpret:
  C1:
    explain: "τ (Kendall's tau) บอกว่าลำดับที่พูดจริงตรงกับแผนแค่ไหน: 1 = ตรงทุกคู่, 0 = ไม่สัมพันธ์กัน, −1 = กลับลำดับทั้งหมด"
    levels: {4: "เรียงตรงตามแผน", 3: "เรียงตามแผนเกือบทั้งหมด", 2: "สลับลำดับบางส่วน", 1: "ลำดับต่างจากแผนมาก"}
  C2:
    explain: "% ของหัวข้อตามแผนที่อธิบายสาระชัดเจน (หัวข้อที่กล่าวถึงเพียงสั้น ๆ นับครึ่ง)"
    levels: {4: "อธิบายครบเกือบทุกหัวข้อ", 3: "อธิบายครบเป็นส่วนใหญ่", 2: "ขาดไปราวครึ่งหนึ่ง", 1: "ขาดหัวข้อส่วนใหญ่"}
  S1:
    explain: "จำนวนพยางค์ต่อวินาที นับเฉพาะช่วงที่พูดจริง ไม่รวมช่วงหยุดและเสียงเติม (เอ่อ อ่า อืม)"
    levels: {4: "ความเร็วพอดี", 3: "ใกล้ช่วงที่เหมาะ", 2: "ออกนอกช่วงที่เหมาะ", 1: "ต่างจากช่วงที่เหมาะมาก"}
    range: {below: "ช้ากว่าช่วงแนะนำ", within: "อยู่ในช่วงแนะนำ", above: "เร็วกว่าช่วงแนะนำ"}
  S2:
    explain: "จำนวนครั้งต่อนาทีที่เงียบนานเกินเกณฑ์ และช่วงเงียบที่นานที่สุด"
    levels: {4: "แทบไม่มีช่วงเงียบยาว", 3: "มีช่วงเงียบยาวบ้าง", 2: "เงียบยาวค่อนข้างบ่อย", 1: "เงียบยาวบ่อยมาก"}
  S3:
    explain: "จำนวนเสียงเติมและคำติดปากตามบริบทต่อนาที เช่น เอ่อ แบบว่า; คำปกติในประโยคไม่นับ"
    levels: {4: "เสียงเติมและคำติดปากน้อยมาก", 3: "มีเสียงเติมและคำติดปากบ้าง", 2: "เสียงเติมและคำติดปากค่อนข้างบ่อย", 1: "เสียงเติมและคำติดปากบ่อยมาก"}
  N1:
    explain: "วัดความต่อเนื่องของการขยับมือและช่วงมือนิ่งค้าง จากความเร็วข้อมือเทียบความกว้างไหล่ (ไม่ตีความความหมายของท่ามือ)"
    levels: {4: "ใช้มือประกอบต่อเนื่อง", 3: "มือนิ่งค้างบ้าง", 2: "มือนิ่งค้างหลายช่วง", 1: "มือนิ่งค้างนานมาก"}
  N2:
    explain: "วัดทิศทางศีรษะที่หันเข้าหากล้อง/ผู้ฟัง รายงาน % เวลาที่หันตรง ไม่ใช่การสบตา"
    levels: {4: "หันหน้าเข้าหากล้องเกือบตลอด", 3: "หันหน้าเข้าหากล้องเป็นส่วนใหญ่", 2: "หันข้างหรือก้มค่อนข้างมาก", 1: "หันหน้าเข้าหากล้องน้อย"}
  T1:
    explain: "% ที่ช่วงนำเสนอจริงต่างจากเวลาเป้าหมาย (เกินหรือขาดคิดแบบเดียวกัน)"
    levels: {4: "ใกล้เวลาเป้าหมายมาก", 3: "ต่างจากเป้าหมายเล็กน้อย", 2: "ต่างจากเป้าหมายพอสมควร", 1: "ต่างจากเป้าหมายมาก"}
    sign: {key: diff_s, above: "ยาวกว่าเวลาเป้าหมาย", below: "สั้นกว่าเวลาเป้าหมาย"}
