name: "PromptPre's checks"
on: [push, pull_request]
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r api/requirements-linux.lock
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:browser
        working-directory: web
      - run: npm audit --omit=dev --audit-level=high
        working-directory: web
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      PROMPTPRES_TEST_POSTGRES: postgresql://postgres:test@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: >-
          python -m pip install -r api/requirements-linux.lock -r requirements-dev.txt -r eval/requirements.txt
          faster-whisper 'mediapipe>=0.10.35,<0.11' pyarrow ruff
      - run: ruff check --select F,C901,PLR0912,PLR0915 api promptpres_shared worker eval tools dev.py pilot.py web/tests/browser_api.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci && npm run build
        working-directory: web
      - run: python -m pytest worker/tests api/tests eval/tests -rs
